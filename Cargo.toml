[package]
name = "turf_bd_backend"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.8", features = ["http2", "macros", "multipart"] }
serde = { version = "1.0.228", features = ["derive"] }
tokio = { version = "1.49.0", features = ["full"] }
uuid = { version = "1.19.0", features = ["v4", "fast-rng", "serde"] }
bcrypt = "0.15"
jsonwebtoken = "9"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.9"
serde_json = "1.0.149"
async-trait = "0.1.89"
axum-extra = { version = "0.10", features = ["cookie"] }
time = "0.3"
dotenvy = "0.15.7"
bigdecimal = { version = "0.4", features = ["serde"] }
sqlx = { version = "0.8", features = ["runtime-tokio-native-tls", "postgres", "macros", "chrono", "uuid", "bigdecimal", "migrate"] }
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }
http = "1"
redis = { version = "0.27", features = ["tokio-comp"] }
deadpool-redis = { version = "0.18", features = ["rt_tokio_1"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
opentelemetry = "0.32.0"
opentelemetry_sdk = { version = "0.32.1", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.32.0", features = ["reqwest-blocking-client", "reqwest-rustls", "tls-roots"] }
tracing-opentelemetry = "0.33.0"
metrics = "0.24"
metrics-exporter-prometheus = "0.16"
lapin = { version = "2", default-features = false, features = ["native-tls"] }
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
moka = { version = "0.12", features = ["future"] }
regex = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
sha2 = "0.10"           # ETag middleware: SHA-256 of response body (Decision 11)
hex = "0.4"            # ETag middleware: encode hash to hex string (Decision 11)
http-body-util = "0.1" # ETag middleware: buffer response body for hashing (Decision 11)
